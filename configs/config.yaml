paths:
  tp_dir: "dataset/CASIA2/Tp"
  gt_dir: "dataset/CASIA2/CASIA 2 Groundtruth"
  output_dir: "outputs"
  colab_tp: "/content/forgery-detection/dataset/CASIA2/Tp"
  colab_gt: "/content/forgery-detection/dataset/CASIA2/CASIA 2 Groundtruth"

training:
  image_size: 384
  batch_size: 16
  cloud_batch_size: 64
  epochs: 5
  learning_rate: 0.00005
  pretrained_encoder: true
  num_workers: 8
  prefetch_factor: 4

  subset_train: 1500
  subset_val: 400

accelerator:
  device: "cuda"
  amp_dtype: "float16"
  allow_tf32: true
  cudnn_benchmark: true
  compile_model: false

loss:
  bce_weight: 0.1
  label_smoothing: 0.1

inference:
  threshold: 0.5
  num_samples: 5
